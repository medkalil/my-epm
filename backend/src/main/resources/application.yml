    jwtSecret: c2VjcmV0S2V5Rm9ySldUVG9rZW5zQW5kVGhpcyBpcyBhIHZlcnkgc3Ryb25nIGFuZCBzZWN1cmUgZm9yIHByb2R1Y3Rpb24=
    jwtExpirationMs: 86400000
